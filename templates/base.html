<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bloom Atlas{% endblock %}</title>
    <meta name="description" content="A visual atlas of flowers and their growing details.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="{{ url_for('index') }}" aria-label="Bloom Atlas home">
        <span class="wordmark-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>BLOOM ATLAS <small>by Bhaskar Mandiya</small></span>
      </a>
      <div class="header-meta"><span class="live-dot"></span> FIELD DIRECTORY / 2026</div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <span>Bloom Atlas / Flower details</span>
      <span>By Bhaskar Mandiya / Built for curious gardeners</span>
    </footer>
  </body>
</html>
